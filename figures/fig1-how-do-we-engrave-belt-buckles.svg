<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8452F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8452F" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="blur">
      <stop offset="0" stop-color="#E8452F" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#E8452F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8452F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C66C"/>
      <stop offset="0.45" stop-color="#C79B33"/>
      <stop offset="1" stop-color="#96701E"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1F2328"/>
    </marker>
  </defs>

  <rect width="1200" height="740" fill="#FBF7F0"/>
  <rect x="14" y="14" width="1172" height="712" fill="none" stroke="#1F2328" stroke-width="2.5"/>
  <rect x="24" y="24" width="1152" height="692" fill="none" stroke="#1F2328" stroke-width="1"/>

  <text x="60" y="80" font-size="25" letter-spacing="5" fill="#1F2328">FIG. 1 &#8212; THE PROBLEM</text>
  <line x1="60" y1="96" x2="1140" y2="96" stroke="#1F2328" stroke-width="1.5"/>

  <!-- ======================= SCIENTIST ======================= -->
  <g>
    <!-- lab coat -->
    <path d="M114 626 L144 418 Q158 374 206 362 L264 362 Q312 374 326 418 L356 626 Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M206 362 L235 418 L264 362" fill="#EDE6DA" stroke="#1F2328" stroke-width="3"/>
    <path d="M235 418 L235 626" stroke="#1F2328" stroke-width="2.5"/>
    <circle cx="235" cy="486" r="5" fill="#1F2328"/>
    <circle cx="235" cy="540" r="5" fill="#1F2328"/>
    <path d="M278 446 h52 v46 h-52 z" fill="none" stroke="#1F2328" stroke-width="2.5"/>
    <line x1="292" y1="428" x2="292" y2="464" stroke="#2A9D5C" stroke-width="5" stroke-linecap="round"/>
    <line x1="306" y1="424" x2="306" y2="464" stroke="#E8452F" stroke-width="5" stroke-linecap="round"/>
    <line x1="320" y1="430" x2="320" y2="464" stroke="#2B5EA8" stroke-width="5" stroke-linecap="round"/>

    <!-- raised arm: outlined sleeve -->
    <path d="M316 404 Q392 386 442 332" fill="none" stroke="#1F2328" stroke-width="36" stroke-linecap="round"/>
    <path d="M316 404 Q392 386 442 332" fill="none" stroke="#FFFFFF" stroke-width="29" stroke-linecap="round"/>
    <line x1="432" y1="316" x2="456" y2="344" stroke="#1F2328" stroke-width="3"/>
    <!-- hand -->
    <circle cx="462" cy="322" r="18" fill="#F2D3B3" stroke="#1F2328" stroke-width="3"/>
    <!-- tongs holding a buckle blank -->
    <path d="M476 312 L528 294 M476 332 L528 322" stroke="#1F2328" stroke-width="4" stroke-linecap="round"/>
    <path d="M524 288 Q556 276 588 292 L588 312 Q556 296 524 308 Z" fill="url(#brass)" stroke="#1F2328" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M215 340 h40 v34 h-40 z" fill="#F2D3B3" stroke="#1F2328" stroke-width="3"/>
    <!-- head -->
    <circle cx="235" cy="268" r="76" fill="#F2D3B3" stroke="#1F2328" stroke-width="3.5"/>

    <!-- wild hair: jagged, irregular, Einstein-ish -->
    <path d="M152 280
             L128 248 L156 246 L134 214 L162 218 L146 180 L174 190 L170 146 L196 176
             L202 128 L222 168 L236 118 L252 166 L272 126 L284 172 L308 140 L310 184
             L336 166 L322 200 L348 212 L324 236 L344 262 L318 276
             Q300 222 235 210 Q170 222 152 280 Z"
          fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- a few interior strands for texture -->
    <path d="M196 206 q18 -22 40 -24" fill="none" stroke="#1F2328" stroke-width="2" opacity="0.55"/>
    <path d="M250 196 q22 -14 44 -6" fill="none" stroke="#1F2328" stroke-width="2" opacity="0.55"/>
    <path d="M172 234 q22 -16 44 -18" fill="none" stroke="#1F2328" stroke-width="2" opacity="0.55"/>
    <!-- goggles -->
    <line x1="158" y1="262" x2="312" y2="262" stroke="#1F2328" stroke-width="7"/>
    <circle cx="206" cy="266" r="30" fill="#DCEBF2" stroke="#1F2328" stroke-width="4"/>
    <circle cx="273" cy="266" r="30" fill="#DCEBF2" stroke="#1F2328" stroke-width="4"/>
    <line x1="236" y1="266" x2="243" y2="266" stroke="#1F2328" stroke-width="6"/>
    <circle cx="219" cy="268" r="7.5" fill="#1F2328"/>
    <circle cx="286" cy="268" r="7.5" fill="#1F2328"/>
    <path d="M190 252 l12 -8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M257 252 l12 -8" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- worried brows -->
    <path d="M178 224 q26 -16 52 -4" fill="none" stroke="#1F2328" stroke-width="5" stroke-linecap="round"/>
    <path d="M251 220 q26 -12 52 6" fill="none" stroke="#1F2328" stroke-width="5" stroke-linecap="round"/>
    <!-- wavy mouth -->
    <path d="M199 320 q14 -14 28 0 q14 14 28 0 q14 -14 26 2" fill="none" stroke="#1F2328" stroke-width="5" stroke-linecap="round"/>
    <!-- sweat -->
    <path d="M336 234 q10 16 10 24 a10 10 0 0 1 -20 0 q0 -8 10 -24 z" fill="#8FC4DE" stroke="#1F2328" stroke-width="2.5"/>

    <!-- speech bubble -->
    <g>
      <path d="M372 126 h216 a14 14 0 0 1 14 14 v62 a14 14 0 0 1 -14 14 h-172 l-34 30 v-30 h-10 a14 14 0 0 1 -14 -14 v-62 a14 14 0 0 1 14 -14 z"
            fill="#FFFFFF" stroke="#1F2328" stroke-width="3"/>
      <text x="487" y="168" font-size="27" text-anchor="middle" fill="#1F2328">&#8220;It&#8217;s FLAT.</text>
      <text x="487" y="200" font-size="27" text-anchor="middle" fill="#1F2328">It&#8217;s basically flat.&#8221;</text>
    </g>
  </g>

  <!-- ======================= LASER + BUCKLE ======================= -->
  <g transform="translate(560,26)">
    <rect x="178" y="150" width="124" height="62" rx="8" fill="#43484F" stroke="#1F2328" stroke-width="3"/>
    <rect x="212" y="212" width="56" height="26" fill="#2E3238" stroke="#1F2328" stroke-width="3"/>
    <text x="240" y="190" font-size="19" text-anchor="middle" fill="#FBF7F0" letter-spacing="2">LASER</text>

    <path d="M226 238 L116 482 L168 482 L240 238 L312 482 L364 482 L254 238 Z" fill="url(#beam)"/>
    <path d="M226 238 L116 482 M254 238 L364 482" stroke="#E8452F" stroke-width="2" opacity="0.6"/>

    <line x1="56" y1="482" x2="424" y2="482" stroke="#E8452F" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="434" y="478" font-size="17" fill="#E8452F">focal plane</text>

    <path d="M66 512 Q240 420 414 512 L414 558 Q240 466 66 558 Z" fill="url(#brass)" stroke="#1F2328" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M66 512 Q240 420 414 512" fill="none" stroke="#FFF3CC" stroke-width="2.5" opacity="0.85"/>

    <circle cx="104" cy="506" r="34" fill="url(#blur)"/>
    <circle cx="376" cy="506" r="34" fill="url(#blur)"/>
    <circle cx="240" cy="466" r="7" fill="#2A9D5C" stroke="#1F2328" stroke-width="2.5"/>

    <!-- sag dimension, offset to the left so it does not sit under the callout -->
    <line x1="86" y1="483" x2="86" y2="513" stroke="#1F2328" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="64" y1="513" x2="108" y2="513" stroke="#1F2328" stroke-width="1.2"/>
  </g>

  <!-- ======================= CALLOUTS ======================= -->
  <g fill="#1F2328">
    <!-- sag -->
    <line x1="650" y1="548" x2="614" y2="608" stroke="#1F2328" stroke-width="1.6" marker-start="url(#ar)"/>
    <text x="606" y="632" font-size="19" text-anchor="end">1.5 mm of</text>
    <text x="606" y="656" font-size="19" text-anchor="end">&#8220;basically flat&#8221;</text>

    <!-- centre -->
    <line x1="806" y1="482" x2="806" y2="432" stroke="#1F2328" stroke-width="1.6" marker-start="url(#ar)"/>
    <text x="806" y="420" font-size="19" text-anchor="middle">sharp!</text>
    <text x="806" y="398" font-size="16" fill="#2A9D5C" text-anchor="middle">(exactly one spot is)</text>

    <!-- right edge -->
    <line x1="950" y1="524" x2="1020" y2="596" stroke="#1F2328" stroke-width="1.6" marker-start="url(#ar)"/>
    <text x="1140" y="620" font-size="19" text-anchor="end">a 2.5&#215; wide</text>
    <text x="1140" y="644" font-size="19" text-anchor="end">smudge of regret</text>
  </g>

  <!-- caption -->
  <line x1="60" y1="672" x2="1140" y2="672" stroke="#1F2328" stroke-width="1.5"/>
  <text x="60" y="702" font-size="22" fill="#1F2328">How do we engrave belt buckles?</text>
  <text x="1140" y="702" font-size="22" text-anchor="end" fill="#6B6257">turns out: by measuring two things first</text>
</svg>
